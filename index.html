 rec.onstart=()=>{if(s.finished)return;clearTimeout(s.watchdog);s.started=Date.now();tone();status('Listening · 4s');s.tick=setInterval(()=>{if(session===s)status('Listening · '+Math.max(0,Math.ceil((VOICE_MS-(Date.now()-s.started))/1000))+'s');},250);s.timer=setTimeout(()=>{clearInterval(s.tick);status('Finishing voice input…');try{rec.stop();}catch{finishVoice(s,'error');}s.grace=setTimeout(()=>finishVoice(s,s.final||s.interim?'recognized':'no_speech'),1500);},VOICE_MS);};
 rec.onresult=e=>{if(s.finished)return;let final='',interim='';for(let i=0;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript+' ';}s.final=final;s.interim=interim;};
 rec.onerror=e=>{if(s.finished)return;const map={'no-speech':'no_speech','not-allowed':'permission_denied','service-not-allowed':'permission_denied','network':'network_error','aborted':'interrupted'};finishVoice(s,map[e.error]||'error');};
 rec.onend=()=>{if(!s.finished)finishVoice(s,s.final||s.interim?'recognized':'no_speech');};
 s.watchdog=setTimeout(()=>finishVoice(s,'timeout'),12000);
 try{rec.start();}catch{finishVoice(s,'error');}
}
function confirmWord(a,method){
 if(a.record.revision!==revision){status('Text changed. Explore again.');return;}
 cancelVoice();last=a;$('word').textContent=a.hit.word;$('word').title=a.hit.word;$('candidates').replaceChildren();
 for(const r of a.rows.slice(0,5)){const span=document.createElement('span');span.className='candidate';span.textContent=r.w.word;span.title=r.w.word;$('candidates').append(span);}
 const payload={...a.record,schema:'notes-selection-v2',selection_id:++selectionSerial,selected_word:a.hit.word,char_start_utf16:a.hit.start,char_end_utf16:a.hit.end,...sentenceContext(a.record.text,a.hit.start,a.hit.end),selection_method:method,user_voice_input:'',voice_input_enabled:voiceEnabled,voice_status:voiceEnabled?'pending':'disabled',ready:false};
 latestPayload=payload;renderJSON();$('export').disabled=true;status('Selected: '+a.hit.word);draw();
 if(voiceEnabled)startVoice(payload);else{emitReady(payload);if(speaking)say('Selected: '+a.hit.word);}
}
function itemAt(x,y){
 const el=document.elementFromPoint(x,y);if(!el||!main.contains(el))return null;
 const button=el.closest('button');if(button)return {kind:'button',id:button.id,key:'button:'+button.id,text:button.getAttribute('aria-label')+(button.disabled?', unavailable':'')};
 if(el===editor||editor.contains(el)){
 // Exploration uses only visible DOM rectangles: no Gaussian or Top 5 computation.
 const g=geometry();const w=g.words.find(w=>w.visible.some(r=>x>=r.x&&x<=r.right&&y>=r.y&&y<=r.bottom));
 return w?{kind:'word',key:'word:'+revision+':'+w.start,text:w.word,start:w.start,end:w.end,revision:g.revision,x,y}:null;
 }
 if(el.closest('.candidate'))return {kind:'text',key:'candidate:'+Array.from($('candidates').children).indexOf(el.closest('.candidate')),text:el.closest('.candidate').textContent};
 if(el.closest('#result'))return {kind:'text',key:'result',text:'Selected: '+$('word').textContent+'. Top five: '+[...$('candidates').children].map(n=>n.textContent).join(', ')};
 if(el.closest('h1'))return {kind:'text',key:'title',text:'Notes'};return null;
}
function explore(item){
 if(!item||item.key===focusItem?.key||session)return;
 focusItem=item;draw();say(item.text);
}
function scheduleExplore(item){clearTimeout(focusTimer);if(item&&item.key!==focusItem?.key)explore(item);}
function activate(item){
 if(!item)return;
 if(item.kind==='word'){
  const g=geometry();if(g.revision!==item.revision){status('Text changed. Explore again.');return;}
  const w=g.words.find(w=>w.start===item.start&&w.end===item.end);if(!w?.visible.length)return;
  const r=w.visible[0];const x=w.visible.some(r=>item.x>=r.x&&item.x<=r.right&&item.y>=r.y&&item.y<=r.bottom)?item.x:r.x+r.width/2;
  const y=w.visible.some(r=>item.x>=r.x&&item.x<=r.right&&item.y>=r.y&&item.y<=r.bottom)?item.y:r.y+r.height/2;
  const a=analyze(g,x,y);focusItem=null;if(a)confirmWord(a,'explore_then_double_tap');
 }else if(item.kind==='button')runButton(item.id);else say(item.text);
}
function updateControls(){
 main.classList.toggle('exploring',speaking&&!editing);$('speech').setAttribute('aria-pressed',String(speaking));$('speech').setAttribute('aria-label',speaking?'Disable explore and read':'Enable explore and read');$('speech').textContent=speaking?'Reading: On':'Start reading';$('speech').setAttribute('aria-label',speaking?'Stop reading':'Start reading');
 $('voice').textContent=voiceEnabled?'Voice input: On':'Voice input: Off';$('voice').setAttribute('aria-pressed',String(voiceEnabled));$('voice').setAttribute('aria-label',voiceEnabled?'Disable voice input':'Enable voice input');
}
function runButton(id){
 if($(id)?.disabled)return;
 if(id==='testSound'){say('Hello. Reading is ready.');return;}
 if(id==='speech'){speaking=!speaking;resetGesture();updateControls();say(speaking?'Reading is on. Slide your finger over the text.':'Reading is off.');}
 if(id==='voice'){
  if(!voiceEnabled&&(!window.isSecureContext||!Recognition)){const text=!window.isSecureContext?'Voice input requires HTTPS':'Speech recognition is unavailable in this browser';status(text);say(text);return;}
  voiceEnabled=!voiceEnabled;if(!voiceEnabled)cancelVoice();updateControls();status(voiceEnabled?'Voice input on':'Voice input off');say(voiceEnabled?'Voice input on':'Voice input off');
 }
 if(id==='mode'){cancelVoice();hush();editing=!editing;clear();editor.contentEditable=editing?'plaintext-only':'false';editor.setAttribute('aria-readonly',String(!editing));editor.dataset.placeholder=editing?'Start typing…':'';$('mode').textContent=editing?'Done':'Edit';$('mode').setAttribute('aria-label',editing?'Finish editing':'Edit text');updateControls();status('');if(editing)editor.focus();else{editor.blur();saveText();if(speaking)say('Explore and read');}}
 if(id==='export'&&latestPayload?.ready){const blob=new Blob([JSON.stringify(latestPayload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='selection.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
}
main.addEventListener('click',e=>{if(e.target.closest('header button, #jsonPanel'))return;if(e.detail!==0&&Date.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation();}},true);
for(const id of ['speech','voice','mode','testSound','export'])$(id).addEventListener('click',e=>{if(id==='export'&&speaking&&!editing&&e.detail!==0){e.preventDefault();return;}runButton(id);});
// Capture the whole app, including controls. In explore mode a double tap activates the
// remembered spoken focus, never the coordinates of the confirming double tap.
main.addEventListener('pointerdown',e=>{
 if(e.target.closest('header button, #jsonPanel'))return;
 if(editing)return;
 if(!speaking){if(e.target===editor||editor.contains(e.target))pointer={id:e.pointerId,x:e.clientX,y:e.clientY,scroll:editor.scrollTop,moved:false};return;}
 e.preventDefault();main.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,downX:e.clientX,downY:e.clientY,time:Date.now(),moved:false,item:itemAt(e.clientX,e.clientY),prior:focusItem});
 if(pointers.size>=2){clearTimeout(focusTimer);clearTimeout(singleTimer);tap=null;hush();const a=[...pointers.values()];multi={y:a.reduce((s,p)=>s+p.y,0)/a.length,scroll:editor.scrollTop};focusItem=null;draw();}
 else if(!tap&&pointers.get(e.pointerId).item?.kind==='word'){explore(pointers.get(e.pointerId).item);}
});
main.addEventListener('pointermove',e=>{
 if(editing)return;
 if(!speaking){if(pointer&&Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>9)pointer.moved=true;return;}
 const p=pointers.get(e.pointerId);if(!p)return;e.preventDefault();p.x=e.clientX;p.y=e.clientY;
 if(multi){if(pointers.size>=2){const a=[...pointers.values()];editor.scrollTop=multi.scroll+multi.y-a.reduce((s,p)=>s+p.y,0)/a.length;}return;}
 if(Math.hypot(p.x-p.downX,p.y-p.downY)>8){p.moved=true;clearTimeout(singleTimer);tap=null;scheduleExplore(itemAt(p.x,p.y));}
});
main.addEventListener('pointerup',e=>{
 if(e.target.closest('header button, #jsonPanel')&&!pointers.has(e.pointerId))return;
 if(editing)return;
 if(!speaking){const p=pointer;pointer=null;if(!p||p.id!==e.pointerId||p.moved||Math.abs(p.scroll-editor.scrollTop)>2)return;if(tap&&Date.now()-tap.time<=DOUBLE_TAP){tap=null;const a=analyze(geometry(),e.clientX,e.clientY);if(a)confirmWord(a,'double_tap');}else tap={time:Date.now()};return;}
 e.preventDefault();suppressClickUntil=Date.now()+700;const p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(!p)return;
 if(multi){if(!pointers.size)multi=null;return;}
 clearTimeout(focusTimer);
 if(p.moved||Date.now()-p.time>500)return;
 if(p.item?.kind==='button'&&['speech','voice','mode'].includes(p.item.id)){clearTimeout(singleTimer);tap=null;runButton(p.item.id);return;}
 if(tap&&Date.now()-tap.time<=DOUBLE_TAP){const frozen=tap.focus;clearTimeout(singleTimer);tap=null;if(frozen)activate(frozen);else say('Explore an item first');}
 else{tap={time:Date.now(),focus:p.prior||focusItem};const item=p.item;singleTimer=setTimeout(()=>{tap=null;explore(item);},DOUBLE_TAP);}
});
main.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);pointer=null;clearTimeout(focusTimer);clearTimeout(singleTimer);tap=null;if(!pointers.size)multi=null;});
main.addEventListener('contextmenu',e=>{if(speaking&&!editing)e.preventDefault();});
// Keyboard fallback for web accessibility; Enter confirms the focused word.
editor.addEventListener('keydown',e=>{if(!editing&&speaking&&e.key==='Enter'){e.preventDefault();activate(focusItem);}});
function saveText(){try{localStorage.setItem('spatial-notes-text',geometry().text);}catch{}}
editor.addEventListener('input',()=>{revision++;cancelVoice();clear();latestPayload=null;renderJSON();$('export').disabled=true;status('');saveText();});
editor.addEventListener('scroll',()=>{if(multi){draw();return;}focusItem=null;clearTimeout(focusTimer);draw();},{passive:true});
function reflow(){resetGesture();draw();}
addEventListener('resize',reflow);window.visualViewport?.addEventListener('resize',reflow);addEventListener('scroll',draw,{passive:true});
addEventListener('pagehide',()=>{cancelVoice();hush();});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelVoice();hush();resetGesture();}});
if(!window.speechSynthesis)$('speech').disabled=true;updateControls();
// Listen for notes:selectionready or read lastSelectionJSON. No network submission occurs here.
window.spatialPrototype={geometry,candidates,analyze,sentenceContext,get last(){return last?.record||null;},get payload(){return latestPayload?structuredClone(latestPayload):null;},get records(){return structuredClone(records);}};
Object.defineProperty(window,'lastSelectionJSON',{get:()=>latestPayload?structuredClone(latestPayload):null});
